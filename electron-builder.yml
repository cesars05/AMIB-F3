appId: mx.cesars05.amib-f3
productName: AMIB F3
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
# El contenido va como recurso externo (resources/content): se puede actualizar sin recompilar la app (ADR-002).
extraResources:
  - from: content
    to: content
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: AMIB-F3-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AMIB F3
publish: null
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
